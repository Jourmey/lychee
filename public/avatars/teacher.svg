<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    主讲老师头像（简单可爱风）。
    · 实际显示只有 28px（ChatPanel 的圆头像），所以只保留「大圆头 + 大眼 + 腮红 + 小嘴」，
      其余细节到这个尺寸根本看不见。
    · 不要眉毛 / 鼻子 / 牙齿 / 衣物明暗 —— 加得越多越像简笔插画，越不可爱。
    · 自带淡色圆底，不靠外层 avatarBg：衣服是紫的、外层渐变也是紫的，两个紫糊在一起
      整个头像就变成"一团紫"，头身比全看不出来。
  -->

  <!-- 圆底 -->
  <circle cx="32" cy="32" r="32" fill="#f1ecff" />

  <!-- 身体（肩膀）：**比头窄**，只从下巴下面露出短短一截。肩比头宽就立刻变成"紫色大山" -->
  <path d="M19,64 C19,50 25,43 32,43 C39,43 45,50 45,64 Z" fill="#8b5cf6" />
  <!-- 领口：V 字。别用圆弧 —— 弧线会和嘴形成两条一模一样的"微笑"，看着像长了两个嘴 -->
  <path
    d="M26,46 L32,52 L38,46"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 头发（后层）：比脸大一圈的圆，脸叠上去后自然成发型 -->
  <circle cx="32" cy="25" r="19" fill="#5d4d78" />

  <!-- 脸 -->
  <circle cx="32" cy="27" r="17" fill="#ffe0c7" />

  <!-- 刘海：外弧走头顶、内弧是发际线（中间高、两鬓低）。一条就够，不用画发丝 -->
  <path
    d="M13,27 C13,12 21,5 32,5 C43,5 51,12 51,27 C47,19 41,17 32,17 C23,17 17,19 13,27 Z"
    fill="#5d4d78"
  />

  <!-- 眼睛：大黑眼珠 + 一大一小两点高光（左右镜像，对称才像玩偶） -->
  <ellipse cx="24.5" cy="27" rx="4" ry="5" fill="#3a3344" />
  <circle cx="23.2" cy="25.3" r="1.7" fill="#ffffff" />
  <circle cx="26" cy="29.2" r="0.85" fill="#ffffff" opacity="0.8" />
  <ellipse cx="39.5" cy="27" rx="4" ry="5" fill="#3a3344" />
  <circle cx="40.8" cy="25.3" r="1.7" fill="#ffffff" />
  <circle cx="38" cy="29.2" r="0.85" fill="#ffffff" opacity="0.8" />

  <!-- 腮红 -->
  <ellipse cx="19.5" cy="33" rx="3" ry="1.9" fill="#ff9fb0" opacity="0.65" />
  <ellipse cx="44.5" cy="33" rx="3" ry="1.9" fill="#ff9fb0" opacity="0.65" />

  <!-- 嘴：一道小弧就是微笑 -->
  <path d="M28.5,35 Q32,38 35.5,35" stroke="#8d4b57" stroke-width="2" stroke-linecap="round" />
</svg>
